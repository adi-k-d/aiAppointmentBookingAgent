apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: formalert

spec:
  replicas: 1

  selector:
    matchLabels:
      app: app

  template:
    metadata:
      labels:
        app: app

    spec:
      containers:
        - name: app

          image: 185591434281.dkr.ecr.ap-south-1.amazonaws.com/jobapp:v3

          ports:
            - containerPort: 8000

          env:
            - name: POSTGRES_URL
              value: postgresql://postgres:password@postgres:5432/db

            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: formalert-config
                  key: REDIS_URL

            - name: PYTHONUNBUFFERED
              valueFrom:
                configMapKeyRef:
                  name: formalert-config
                  key: PYTHONUNBUFFERED

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"