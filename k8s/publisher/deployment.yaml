apiVersion: apps/v1
kind: Deployment

metadata:
 name: publisher
 namespace: formalert

spec:
 replicas: 1
 selector:
  matchLabels:
   app: publisher

 template:
  metadata:
   labels:
    app: publisher


  spec:
   containers:
    - name: publisher
      image: 185591434281.dkr.ecr.ap-south-1.amazonaws.com/jobapp:v3
      imagePullPolicy: IfNotPresent
      command:
       - python
       - publisher.py

      env:
       - name: POSTGRES_URL
         value: postgresql://postgres:password@postgres:5432/db

       - name: REDIS_URL
         valueFrom:
          configMapKeyRef:
            name: formalert-config
            key: REDIS_URL

       - name: PYTHONUNBUFFERED
         valueFrom:
          configMapKeyRef:
            name: formalert-config
            key: PYTHONUNBUFFERED
      

   